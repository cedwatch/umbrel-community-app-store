name: Build & Push BlockBoard Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'cedwatch-blockboard/app/**'
      - 'cedwatch-blockboard/docker/**'
      - 'cedwatch-blockboard/Dockerfile'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./cedwatch-blockboard
          file: ./cedwatch-blockboard/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/cedwatch/blockboard:latest
            ghcr.io/cedwatch/blockboard:1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
