manifestVersion: 1
id: cedwatch-blockboard
name: BlockBoard
tagline: Real-time Bitcoin dashboard — price, fees, blocks, Lightning & more
category: finance
version: "1.0.0"
port: 4000
description: >-
  BlockBoard is a privacy-first, real-time Bitcoin dashboard.
  No tracking. No ads. No account. Just pure signal.

  Features: live BTC price with 8 currency pairs, mempool fees,
  block height & hashrate, candle chart (9 ranges), market cap,
  ETF 24h flow, Lightning & Liquid Network stats, halving countdown,
  BlockBoard Pulse sentiment index, weather + timezone clock,
  8 skins (BTC Orange, Lightning, Liquid, Plan B, El Zonte, Amorgos, Dubai, Green Back),
  PWA installable. Built in Kampot, Cambodia. Open-source. Donationware.
releaseNotes: >-
  v1.0.0 — Initial release on Umbrel Community App Store.
developer: Ced (ced.watch)
website: https://blockboard.live
repo: https://github.com/cedwatch/umbrel-community-app-store
support: https://github.com/cedwatch/umbrel-community-app-store/issues
icon: https://raw.githubusercontent.com/cedwatch/umbrel-community-app-store/main/cedwatch-blockboard/icon.png
